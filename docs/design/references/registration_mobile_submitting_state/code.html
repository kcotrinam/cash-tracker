<!DOCTYPE html>

<html class="dark" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>CashTracker - Crear cuenta</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-fixed-dim": "#c5c7c6",
                        "primary-container": "#1a1c1e",
                        "on-primary-fixed-variant": "#454749",
                        "outline-variant": "#44474a",
                        "on-tertiary-container": "#8b837d",
                        "tertiary-fixed": "#ebe0da",
                        "outline": "#8f9194",
                        "error-container": "#93000a",
                        "on-primary-container": "#838486",
                        "background": "#0e141a",
                        "on-tertiary-fixed": "#201b17",
                        "primary-fixed": "#e2e2e5",
                        "on-primary-fixed": "#1a1c1e",
                        "surface": "#0e141a",
                        "surface-container-low": "#161c23",
                        "surface-variant": "#2f353c",
                        "surface-bright": "#343a41",
                        "on-primary": "#2f3133",
                        "inverse-on-surface": "#2b3138",
                        "inverse-primary": "#5d5e61",
                        "surface-tint": "#c6c6c9",
                        "on-background": "#dde3ec",
                        "on-surface-variant": "#c5c6ca",
                        "on-secondary-fixed-variant": "#454747",
                        "on-secondary-fixed": "#191c1c",
                        "tertiary-container": "#201b17",
                        "secondary-container": "#474a49",
                        "primary-fixed-dim": "#c6c6c9",
                        "tertiary-fixed-dim": "#cfc5be",
                        "on-secondary": "#2e3131",
                        "surface-container-high": "#252b31",
                        "secondary-fixed": "#e1e3e2",
                        "on-surface": "#dde3ec",
                        "on-error": "#690005",
                        "surface-container-lowest": "#090f15",
                        "surface-container": "#1a2027",
                        "inverse-surface": "#dde3ec",
                        "tertiary": "#cfc5be",
                        "on-secondary-container": "#b7b9b8",
                        "surface-dim": "#0e141a",
                        "secondary": "#c5c7c6",
                        "on-tertiary": "#352f2b",
                        "error": "#ffb4ab",
                        "on-error-container": "#ffdad6",
                        "surface-container-highest": "#2f353c",
                        "primary": "#c6c6c9",
                        "on-tertiary-fixed-variant": "#4c4641"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "unit": "8px",
                        "margin-mobile": "16px",
                        "margin-desktop": "40px",
                        "gutter": "24px",
                        "container-max": "1200px",
                        "touch-target-min": "48px"
                    },
                    "fontFamily": {
                        "display-lg": ["Geist"],
                        "headline-md": ["Geist"],
                        "body-lg": ["Geist"],
                        "display-lg-mobile": ["Geist"],
                        "label-sm": ["Geist"],
                        "mono-value": ["Geist"],
                        "body-md": ["Geist"]
                    },
                    "fontSize": {
                        "display-lg": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                        "headline-md": ["24px", { "lineHeight": "1.3", "letterSpacing": "-0.01em", "fontWeight": "500" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "display-lg-mobile": ["32px", { "lineHeight": "1.2", "fontWeight": "600" }],
                        "label-sm": ["13px", { "lineHeight": "1.4", "letterSpacing": "0.02em", "fontWeight": "500" }],
                        "mono-value": ["20px", { "lineHeight": "1", "letterSpacing": "-0.01em", "fontWeight": "500" }],
                        "body-md": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            font-family: 'Geist', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        
        .form-input {
            background-color: theme('colors.surface-container-low');
            border: 1px solid theme('colors.outline-variant');
            color: theme('colors.on-surface');
            transition: all 0.2s ease;
        }
        
        .form-input:focus {
            border-color: theme('colors.primary');
            outline: none;
            box-shadow: 0 0 0 1px theme('colors.primary');
        }
        
        .form-input::placeholder {
            color: theme('colors.on-surface-variant');
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col items-center justify-center pt-safe pb-safe px-margin-mobile antialiased">
<div class="w-full max-w-[390px] flex flex-col h-full justify-between gap-8 py-8">
<header class="flex flex-col gap-unit items-start w-full">
<div class="flex items-center gap-2 mb-4">
<span class="material-symbols-outlined text-primary text-[32px]">account_balance_wallet</span>
<span class="font-headline-md text-headline-md font-bold text-on-background tracking-tight">CashTracker</span>
</div>
<h1 class="font-display-lg-mobile text-display-lg-mobile text-on-background mt-4">Crea tu cuenta</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-2 max-w-[280px]">Comienza a organizar tus finanzas personales.</p>
</header>
<main class="w-full flex-1 flex flex-col gap-6 mt-8">
<form class="flex flex-col gap-5 w-full" id="registrationForm">
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-1" for="fullName">Nombre completo</label>
<input class="form-input h-touch-target-min rounded-lg px-4 font-body-md text-body-md w-full" disabled="true" id="fullName" name="fullName" placeholder="Tu nombre" required="" type="text"/>
</div>
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-1" for="email">Correo electrónico</label>
<input class="form-input h-touch-target-min rounded-lg px-4 font-body-md text-body-md w-full" disabled="true" id="email" name="email" placeholder="nombre@ejemplo.com" required="" type="email"/>
</div>
<div class="flex flex-col gap-2 relative">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-1" for="password">Contraseña</label>
<div class="relative w-full">
<input class="form-input h-touch-target-min rounded-lg pl-4 pr-12 font-body-md text-body-md w-full" disabled="true" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-0 top-0 h-touch-target-min w-touch-target-min flex items-center justify-center text-on-surface-variant hover:text-on-surface transition-colors focus:outline-none" id="togglePassword" type="button">
<span class="material-symbols-outlined" id="toggleIcon">visibility</span>
</button>
</div>
<p class="font-label-sm text-label-sm text-on-surface-variant ml-1 mt-1">Mínimo 10 caracteres.</p>
</div>
<div class="flex flex-col gap-2 relative">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-1" for="confirmPassword">Confirmar contraseña</label>
<div class="relative w-full">
<input class="form-input h-touch-target-min rounded-lg pl-4 pr-12 font-body-md text-body-md w-full" disabled="true" id="confirmPassword" name="confirmPassword" placeholder="••••••••" required="" type="password"/>
<button aria-label="Toggle confirm password visibility" class="absolute right-0 top-0 h-touch-target-min w-touch-target-min flex items-center justify-center text-on-surface-variant hover:text-on-surface transition-colors focus:outline-none" id="toggleConfirmPassword" type="button">
<span class="material-symbols-outlined" id="toggleConfirmIcon">visibility</span>
</button>
</div>
</div>
<button class="h-touch-target-min w-full bg-secondary text-background font-body-md text-body-md font-medium rounded-lg flex items-center justify-center mt-4 transition-all duration-200 active:scale-[0.98] hover:bg-secondary-fixed-dim focus:outline-none focus:ring-2 focus:ring-secondary focus:ring-offset-2 focus:ring-offset-background opacity-80" disabled="true" type="submit"><span class="material-symbols-outlined animate-spin mr-2">progress_activity</span> Creando cuenta...</button>
</form>
</main>
<footer class="w-full text-center mt-auto pt-8">
<a class="inline-flex items-center gap-1 font-body-md text-body-md text-on-surface-variant hover:text-primary transition-colors focus:outline-none p-2 rounded" href="#">
<span>¿Ya tienes una cuenta?</span>
<span class="text-primary font-medium ml-1">Iniciar sesión</span>
</a>
</footer>
</div>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const togglePassword = document.getElementById('togglePassword');
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('toggleIcon');
            
            const toggleConfirmPassword = document.getElementById('toggleConfirmPassword');
            const confirmPasswordInput = document.getElementById('confirmPassword');
            const toggleConfirmIcon = document.getElementById('toggleConfirmIcon');
            
            const form = document.getElementById('registrationForm');

            togglePassword.addEventListener('click', () => {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                toggleIcon.textContent = type === 'password' ? 'visibility' : 'visibility_off';
            });
            
            toggleConfirmPassword.addEventListener('click', () => {
                const type = confirmPasswordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                confirmPasswordInput.setAttribute('type', type);
                toggleConfirmIcon.textContent = type === 'password' ? 'visibility' : 'visibility_off';
            });

            form.addEventListener('submit', (e) => {
                e.preventDefault();
                const submitBtn = form.querySelector('button[type="submit"]');
                const originalText = submitBtn.textContent;
                
                submitBtn.innerHTML = '<span class="material-symbols-outlined animate-spin mr-2">progress_activity</span> Creando...';
                submitBtn.classList.add('opacity-80');
                
                setTimeout(() => {
                    submitBtn.innerHTML = '¡Cuenta creada!';
                    submitBtn.classList.remove('bg-secondary', 'text-background', 'opacity-80');
                    submitBtn.classList.add('bg-primary-container', 'text-primary');
                    
                    setTimeout(() => {
                        submitBtn.textContent = originalText;
                        submitBtn.classList.add('bg-secondary', 'text-background');
                        submitBtn.classList.remove('bg-primary-container', 'text-primary');
                        form.reset();
                    }, 2000);
                }, 1500);
            });
            
            const inputs = document.querySelectorAll('.form-input');
            inputs.forEach(input => {
                input.addEventListener('focus', () => {
                    input.parentElement.closest('.flex-col').querySelector('label').classList.add('text-primary');
                    input.parentElement.closest('.flex-col').querySelector('label').classList.remove('text-on-surface-variant');
                });
                
                input.addEventListener('blur', () => {
                    input.parentElement.closest('.flex-col').querySelector('label').classList.remove('text-primary');
                    input.parentElement.closest('.flex-col').querySelector('label').classList.add('text-on-surface-variant');
                });
            });
        });
    </script>
</body></html>

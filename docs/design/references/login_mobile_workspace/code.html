<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>

<title>CashTracker Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

            font-weight: 600;
        }
    </style>

            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-error-container": "#ffdad6",
                        "secondary": "#c5c7c6",
                        "secondary-fixed": "#e1e3e2",
                        "on-secondary-container": "#b7b9b8",
                        "primary-container": "#1a1c1e",
                        "surface": "#0e141a",
                        "on-background": "#dde3ec",
                        "outline-variant": "#44474a",
                        "on-tertiary-fixed": "#201b17",
                        "inverse-on-surface": "#2b3138",
                        "surface-container-highest": "#2f353c",
                        "tertiary": "#cfc5be",
                        "surface-tint": "#c6c6c9",
                        "surface-dim": "#0e141a",

                        "inverse-primary": "#5d5e61",
                        "on-primary": "#2f3133",

<body class="bg-surface text-on-surface h-screen w-screen flex flex-col items-center justify-center p-margin-mobile md:p-margin-desktop overflow-hidden">
<div class="w-full max-w-[400px] flex flex-col gap-8 z-10 relative">
<!-- Header -->
<div class="flex flex-col gap-2">
<span class="material-symbols-outlined text-primary text-[48px]">account_balance_wallet</span>
<h1 class="font-display-lg-mobile text-display-lg-mobile text-primary">CashTracker</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Sign in to your professional workspace.</p>
</div>
<!-- Form -->
<form class="flex flex-col gap-6 w-full">
<div class="flex flex-col gap-4">
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="email">Email Address</label>
<input class="bg-surface-container-low border border-outline-variant rounded-lg px-4 h-touch-target-min text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors font-body-md text-body-md" id="email" placeholder="name@company.com" type="email"/>
</div>
<div class="flex flex-col gap-2">
<div class="flex justify-between items-center">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="password">Password</label>
<a class="font-label-sm text-label-sm text-primary hover:text-on-surface transition-colors" href="#">Forgot?</a>
</div>
<input class="bg-surface-container-low border border-outline-variant rounded-lg px-4 h-touch-target-min text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors font-body-md text-body-md" id="password" placeholder="••••••••" type="password"/>
</div>
</div>
<div class="flex flex-col gap-4">
<button class="bg-primary text-on-primary font-label-sm text-label-sm rounded-lg h-touch-target-min w-full hover:bg-surface-tint active:scale-95 transition-all duration-200 flex items-center justify-center font-bold" type="button">
                    Sign In
                </button>
<div class="flex items-center gap-4 w-full">
<div class="h-[1px] bg-outline-variant flex-1"></div>
<span class="font-label-sm text-label-sm text-on-surface-variant">OR</span>
<div class="h-[1px] bg-outline-variant flex-1"></div>
</div>
<button class="bg-transparent border border-outline-variant text-on-surface font-label-sm text-label-sm rounded-lg h-touch-target-min w-full hover:bg-surface-container-low active:scale-95 transition-all duration-200 flex items-center justify-center gap-2" type="button">
<svg class="w-5 h-5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                    Sign in with Google
                </button>
</div>
</form>
<!-- Footer -->
<div class="text-center mt-4">
<p class="font-body-md text-body-md text-on-surface-variant">
                Don't have an account? <a class="text-primary hover:text-on-surface transition-colors" href="#">Request Access</a>
</p>
</div>
</div>
</body></html>

<!DOCTYPE html>

<html class="dark" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login (Mobile) - Loading</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

            font-weight: 600;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-container": "#b7b9b8",
                        "surface-container-high": "#252b31",
                        "surface-container-low": "#161c23",
                        "on-tertiary-fixed": "#201b17",
                        "tertiary-fixed": "#ebe0da",
                        "on-surface": "#dde3ec",
                        "error": "#ffb4ab",
                        "on-surface-variant": "#c5c6ca",
                        "inverse-primary": "#5d5e61",
                        "on-primary-container": "#838486",
                        "primary-container": "#1a1c1e",
                        "on-background": "#dde3ec",
                        "primary-fixed-dim": "#c6c6c9",
                        "on-primary": "#2f3133",
                        "surface-container-highest": "#2f353c",
                        "error-container": "#93000a",
                        "on-secondary-fixed-variant": "#454747",
                        "outline": "#8f9194",
                        "surface-variant": "#2f353c",
                        "on-secondary": "#2e3131",
                        "on-primary-fixed": "#1a1c1e",
                        "inverse-surface": "#dde3ec",
                        "primary": "#c6c6c9",
                        "tertiary-fixed-dim": "#cfc5be",
                        "on-tertiary": "#352f2b",
                        "on-secondary-fixed": "#191c1c",
                        "tertiary-container": "#201b17",
                        "inverse-on-surface": "#2b3138",
                        "on-primary-fixed-variant": "#454749",
                        "on-tertiary-fixed-variant": "#4c4641",
                        "primary-fixed": "#e2e2e5",

                        "outline-variant": "#44474a",
                        "on-error-container": "#ffdad6",
                        "secondary-container": "#474a49",
                        "on-error": "#690005",
                        "secondary": "#c5c7c6",
                        "secondary-fixed": "#e1e3e2",
                        "surface-dim": "#0e141a",
                        "surface-container": "#1a2027",
                        "surface-bright": "#343a41",
                        "surface": "#0e141a",
                        "secondary-fixed-dim": "#c5c7c6"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "unit": "8px",
                        "margin-desktop": "40px",
                        "gutter": "24px",

<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background dark:bg-background text-on-surface dark:text-on-surface font-body-md text-body-md antialiased flex flex-col min-h-screen">
<main class="flex-grow flex flex-col w-full max-w-[390px] mx-auto px-margin-mobile pt-12 pb-8">
<header class="mb-12 flex flex-col gap-2">
<h1 class="font-display-lg-mobile text-display-lg-mobile tracking-tight text-on-surface">CashTracker</h1>
</header>
<section class="flex flex-col gap-8 flex-grow">
<div>
<h2 class="font-headline-md text-headline-md text-on-surface mb-2">Bienvenido de nuevo</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Inicia sesión para continuar con tus finanzas.</p>
</div>
<form class="flex flex-col gap-6" onsubmit="event.preventDefault();">
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="email">Correo electrónico</label>
<input class="h-touch-target-min bg-surface-container-low border border-outline-variant rounded-lg px-4 font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="email" placeholder="nombre@ejemplo.com" type="email"/>
</div>
<div class="flex flex-col gap-2 relative">
<label class="font-label-sm text-label-sm text-on-surface-variant" for="password">Contraseña</label>
<div class="relative w-full">
<input class="w-full h-touch-target-min bg-surface-container-low border border-outline-variant rounded-lg pl-4 pr-12 font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="password" placeholder="••••••••" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-0 top-0 h-full w-[44px] flex items-center justify-center text-on-surface-variant hover:text-on-surface transition-colors focus:outline-none focus:ring-2 focus:ring-primary rounded-r-lg" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" id="visibility-icon">visibility_off</span>
</button>
</div>
</div>
<div class="mt-4 flex flex-col gap-4">
<button class="w-full h-touch-target-min bg-secondary text-on-secondary rounded-lg font-body-md text-body-md font-medium opacity-80 cursor-not-allowed flex items-center justify-center gap-2" disabled="" type="submit">
<svg class="animate-spin h-5 w-5 text-on-secondary" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
<path class="opacity-75" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z" fill="currentColor"></path>
</svg>
    Iniciando sesión...
</button>
<div class="text-center mt-2">
<span class="font-label-sm text-label-sm text-on-surface-variant">¿Aún no tienes una cuenta?</span>
<a class="font-label-sm text-label-sm text-primary hover:text-on-surface transition-colors underline-offset-4 hover:underline ml-1 focus:outline-none focus:ring-2 focus:ring-primary rounded-sm" href="#">Crear cuenta</a>
</div>
</div>
</form>
</section>
</main>
<script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const visibilityIcon = document.getElementById('visibility-icon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                visibilityIcon.textContent = 'visibility';
            } else {
                passwordInput.type = 'password';
                visibilityIcon.textContent = 'visibility_off';
            }
        }
    </script>
</body></html>

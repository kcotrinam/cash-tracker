packages:
  - apps/*
  - packages/*

# These optional dependency scripts are intentionally not executed locally.
ignoredBuiltDependencies:
  - '@scarf/scarf'
  - unrs-resolver
allowBuilds:
  '@prisma/engines': true
  '@scarf/scarf': false
  argon2: true
  esbuild: true
  prisma: true
  unrs-resolver: false

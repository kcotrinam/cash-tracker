services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cashtracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cashtracker_local_only}
      POSTGRES_DB: ${POSTGRES_DB:-cashtracker}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - cashtracker_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cashtracker_postgres_data:
